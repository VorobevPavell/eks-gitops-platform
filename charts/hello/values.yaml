environment: local

replicaCount: 2

image:
  repository: ghcr.io/vorobevpavell/hello
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

containerPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
