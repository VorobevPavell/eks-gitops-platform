name: k8s

on:
  pull_request:
    paths: ["app/**", "charts/**", "gitops/**", "scripts/**", "Makefile", ".github/workflows/k8s.yml"]
  push:
    branches: [main]
    paths: ["app/**", "charts/**", "gitops/**", "scripts/**", "Makefile", ".github/workflows/k8s.yml"]

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  KIND_VERSION: v0.33.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - run: make lint-k8s

  e2e:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: gitops-e2e
      - name: Argo CD syncs dev and prod from this commit
        env:
          GIT_TOKEN: ${{ github.token }}
        run: scripts/e2e.sh
