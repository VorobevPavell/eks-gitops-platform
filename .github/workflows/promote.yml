name: promote

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit hello-dev is synced to (Argo CD, hello-dev, current sync revision)
        type: string
        required: true
      from:
        description: Environment whose image is promoted
        type: choice
        options: [dev]
        default: dev
      to:
        description: Target environment
        type: choice
        options: [prod]
        default: prod

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.to }}
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      REVISION: ${{ inputs.revision }}
      REASON: "promoted ${{ inputs.revision }} from ${{ inputs.from }} by ${{ github.actor }}, run #${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Promote the revision ${{ inputs.from }} runs to ${{ inputs.to }}
        run: scripts/promote.sh "$FROM" "$TO" "$REVISION" "$REASON"
